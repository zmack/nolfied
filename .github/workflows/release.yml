# Publish GitHub releases from .github/release-notes/.
#
# Each vX.Y.Z.md there is one release. On a push to main that touches the
# notes (or this workflow), every version that has notes but no release yet
# is published: the tag is created on the pushed commit, with the ROMs from
# dist/ attached. To release, add the next notes file and push to main.
#
# The ROMs are the ones committed in dist/: building needs the Calypsi
# toolchain, which CI doesn't have, so a release ships exactly what was
# built and tested locally (README.md, "Building").
name: release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-notes/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish versions that have notes but no release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for notes in .github/release-notes/v*.md; do
            v=$(basename "$notes" .md)
            if gh release view "$v" >/dev/null 2>&1; then
              echo "$v: already released"
              continue
            fi
            out="out/$v"
            mkdir -p "$out"
            cp dist/nolfied.sfc "$out/nolfied-$v.sfc"
            cp dist/legacy/nolfied-asm.sfc "$out/nolfied-$v-asm.sfc"
            (cd "$out" && sha256sum *.sfc > SHA256SUMS)
            gh release create "$v" "$out"/* \
              --target "$GITHUB_SHA" --title "NOLFIED $v" --notes-file "$notes"
            echo "$v: released"
          done
